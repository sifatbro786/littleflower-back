# /etc/nginx/sites-available/littleflower  (ln -s into sites-enabled, then nginx -t && systemctl reload nginx)
# Replace school.example.com. TLS by certbot (--nginx) after the first HTTP start.

upstream littleflower_api { server 127.0.0.1:4020; keepalive 16; }
upstream littleflower_web { server 127.0.0.1:3000; keepalive 16; }

server {
    listen 80;
    server_name school.example.com www.school.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://school.example.com$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name school.example.com;
    # ssl_certificate / ssl_certificate_key: added by certbot

    client_max_body_size 2m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Start report-only; switch to Content-Security-Policy after a week without reports in the browser console.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob: https://i.ytimg.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-src https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self'; form-action 'self' https://sandbox.sslcommerz.com https://securepay.sslcommerz.com; base-uri 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Express API (also the gateway IPN / success / fail / cancel callbacks)
    location /api/ {
        proxy_pass http://littleflower_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s; # publish results / CSV import batches
    }
    location /api/uploads { client_max_body_size 16m; proxy_pass http://littleflower_api; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Host $host; }
    location ~ ^/api/students/[^/]+/photo$ { client_max_body_size 16m; proxy_pass http://littleflower_api; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Host $host; }

    # Public uploads straight from disk (never the private folder)
    location /uploads/public/ {
        alias /var/www/littleflower/uploads/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    # Private files (student photos): only reachable through the API's X-Accel-Redirect after a scope check
    location /_protected/ {
        internal;
        alias /var/www/littleflower/uploads/private/;
        add_header Cache-Control "private, no-store";
    }
    # Next revalidate hook is for the worker on localhost only
    location /internal/ { deny all; }

    location /_next/static/ { proxy_pass http://littleflower_web; expires 365d; add_header Cache-Control "public, immutable"; }
    location / {
        proxy_pass http://littleflower_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
